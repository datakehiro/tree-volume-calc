<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幹材積計算アプリ</title>
<style>
  body { font-family: 'Meiryo', sans-serif; background: #f0f4f0; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { text-align: center; color: #2d5a27; font-size: 1.4em; margin-bottom: 20px; }
  .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .card h2 { color: #2d5a27; font-size: 1em; margin: 0 0 14px 0; border-bottom: 2px solid #7ab870; padding-bottom: 6px; }
  label { display: block; font-size: 0.85em; color: #555; margin-bottom: 4px; margin-top: 10px; }
  input[type="number"], input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 1em;
  }
  input:focus { outline: none; border-color: #7ab870; box-shadow: 0 0 0 2px #7ab87033; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    margin-top: 16px; width: 100%; padding: 11px;
    background: #2d5a27; color: white; border: none;
    border-radius: 8px; font-size: 1em; cursor: pointer;
  }
  button:hover { background: #3a7232; }
  .result-box {
    background: #eaf5e8; border: 2px solid #7ab870; border-radius: 8px;
    padding: 14px; text-align: center; margin-top: 14px;
  }
  .result-box .label { font-size: 0.85em; color: #555; }
  .result-box .value { font-size: 2.2em; font-weight: bold; color: #2d5a27; }
  .result-box .unit { font-size: 0.9em; color: #555; }
  .result-box.error { background: #fdecea; border-color: #e57373; color: #c62828; font-size: 0.9em; }
  .log-area {
    background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px;
    padding: 10px; font-size: 0.8em; font-family: monospace;
    max-height: 240px; overflow-y: auto; white-space: pre; color: #333;
  }
  .log-empty { color: #aaa; font-style: italic; font-family: sans-serif; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-secondary {
    flex: 1; padding: 8px; background: #6a9f64; color: white;
    border: none; border-radius: 6px; font-size: 0.85em; cursor: pointer;
  }
  .btn-secondary:hover { background: #527a4d; }
  .btn-danger { background: #c62828; }
  .btn-danger:hover { background: #9b1c1c; }
  .calc-note { font-size: 0.78em; color: #777; margin-top: 4px; }
  .tab-row { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 7px; text-align: center; cursor: pointer;
    border: 1px solid #ccc; border-radius: 6px; font-size: 0.85em; background: #f5f5f5; }
  .tab.active { background: #2d5a27; color: white; border-color: #2d5a27; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🌲 幹材積計算アプリ</h1>

  <div class="card">
    <h2>計測値の入力</h2>
    <label>管理番号（任意）</label>
    <input type="text" id="mgmtNo" placeholder="例: T-001">

    <label>樹高（m）</label>
    <input type="number" id="height" placeholder="例: 15" min="2" max="32" step="1">

    <div class="tab-row" style="margin-top:12px;">
      <div class="tab active" id="tab-dbh" onclick="switchTab('dbh')">胸高直径(cm)を入力</div>
      <div class="tab" id="tab-circ" onclick="switchTab('circ')">胸高幹周(cm)から計算</div>
    </div>

    <div id="panel-dbh">
      <label>胸高直径（cm）</label>
      <input type="number" id="dbh" placeholder="例: 24" min="10" max="80" step="2">
    </div>

    <div id="panel-circ" class="hidden">
      <label>胸高幹周（cm）</label>
      <input type="number" id="circ" placeholder="例: 75.4" step="0.1" oninput="calcDbhFromCirc()">
      <div class="calc-note" id="circ-result">→ 胸高直径：（未入力）</div>
    </div>

    <button onclick="lookup()">幹材積を検索</button>

    <div id="result"></div>
  </div>

  <div class="card">
    <h2>記録ログ</h2>
    <div class="log-area" id="logArea"><span class="log-empty">記録はまだありません</span></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="downloadLog()">テキストでダウンロード</button>
      <button class="btn-secondary btn-danger" onclick="clearLog()">ログを消去</button>
    </div>
  </div>
</div>

function renderLog() {
  const el = document.getElementById('logArea');
  if (logLines.length === 0) {
    el.innerHTML = '<span class="log-empty">記録はまだありません</span>';
  } else {
    el.textContent = logLines.join('\n');
    el.scrollTop = el.scrollHeight;
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-dbh').className = 'tab' + (tab==='dbh'?' active':'');
  document.getElementById('tab-circ').className = 'tab' + (tab==='circ'?' active':'');
  document.getElementById('panel-dbh').className = tab==='dbh' ? '' : 'hidden';
  document.getElementById('panel-circ').className = tab==='circ' ? '' : 'hidden';
}

function calcDbhFromCirc() {
  const circ = parseFloat(document.getElementById('circ').value);
  const el = document.getElementById('circ-result');
  if (isNaN(circ) || circ <= 0) {
    el.textContent = '→ 胸高直径：（未入力）';
    return null;
  }
  const dbh = Math.floor(circ / 3.14159 / 2) * 2;  // FLOOR(circ/3.14159, 2)
  el.textContent = `→ 胸高直径：${dbh} cm（= FLOOR(${circ}/3.14159, 2)）`;
  return dbh;
}

function getDbh() {
  if (currentTab === 'dbh') {
    return parseFloat(document.getElementById('dbh').value);
  } else {
    return calcDbhFromCirc();
  }
}

function findNearest(arr, val) {
  return arr.reduce((a, b) => Math.abs(b - val) < Math.abs(a - val) ? b : a);
}

function lookup() {
  const h = parseFloat(document.getElementById('height').value);
  const d = getDbh();
  const mgmt = document.getElementById('mgmtNo').value.trim();
  const resultEl = document.getElementById('result');

  if (isNaN(h) || isNaN(d) || d <= 0) {
    resultEl.innerHTML = '<div class="result-box error">樹高と胸高直径（または胸高幹周）を入力してください。</div>';
    return;
  }

  const nearH = findNearest(heights, h);
  const nearD = findNearest(diameters, d);
  const row = volumeTable[nearH];
  const vol = row ? row[nearD] : undefined;

  if (vol === undefined) {
    resultEl.innerHTML = `<div class="result-box error">該当する材積データがありません。<br>（樹高 ${nearH}m / 胸高直径 ${nearD}cm の組み合わせ）</div>`;
    return;
  }

  const warned = (nearH !== Math.round(h) || nearD !== d) ?
    `<div style="font-size:0.78em;color:#777;margin-top:6px;">※ 表の最近傍値を使用: 樹高 ${nearH}m / 胸高直径 ${nearD}cm</div>` : '';

  resultEl.innerHTML = `
    <div class="result-box">
      <div class="label">幹材積</div>
      <div class="value">${vol}</div>
      <div class="unit">m³</div>
      <div style="font-size:0.8em;color:#555;margin-top:6px;">樹高 ${nearH}m ／ 胸高直径 ${nearD}cm</div>
      ${warned}
    </div>`;

  // ログに追記
  const now = new Date();
  const ts = now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'});
  const mgmtStr = mgmt ? `[${mgmt}] ` : '';
  let circStr = '';
  if (currentTab === 'circ') {
    const circ = parseFloat(document.getElementById('circ').value);
    circStr = ` (幹周${circ}cm→直径${d}cm)`;
  }
  const line = `${ts} ${mgmtStr}樹高:${nearH}m 胸高直径:${nearD}cm${circStr} → 材積:${vol}m³`;
  logLines.push(line);
  localStorage.setItem('volumeLog', JSON.stringify(logLines));
  renderLog();
}

function downloadLog() {
  if (logLines.length === 0) { alert('ログがありません。'); return; }
  const blob = new Blob([logLines.join('\n')], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '幹材積記録_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
}

function clearLog() {
  if (!confirm('ログをすべて削除しますか？')) return;
  logLines = [];
  localStorage.removeItem('volumeLog');
  renderLog();
}

// 初期化
renderLog();
</script>
</body>
</html>
